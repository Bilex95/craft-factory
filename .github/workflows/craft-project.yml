name: Craft Project (Tue/Thu)

on:
  schedule:
    # Tuesday & Thursday 11:05 UTC (12:05 WAT) + random 0-3h sleep below.
    #   Tue -> generate + publish a new public repo, then post the digest.
    #   Thu -> post a hand-refinement pass (checklist + rot scan). No new repo.
    - cron: "5 11 * * 2,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run to simulate (auto = decide by weekday)"
        type: choice
        options: [auto, new, refine]
        default: auto
      skip_delay:
        description: "Skip the random delay (for manual test runs)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - id: pick
        run: |
          REQ="${{ inputs.mode || 'auto' }}"
          if [ "$REQ" != "auto" ]; then
            echo "mode=$REQ" >> "$GITHUB_OUTPUT"
          else
            DOW=$(date -u +%u)   # 1=Mon .. 7=Sun
            if [ "$DOW" = "4" ]; then
              echo "mode=refine" >> "$GITHUB_OUTPUT"
            else
              echo "mode=new" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "Resolved mode: $(cat "$GITHUB_OUTPUT")"

  new-project:
    needs: decide
    if: ${{ needs.decide.outputs.mode == 'new' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Random afternoon delay
        if: ${{ github.event_name == 'schedule' || inputs.skip_delay == false }}
        run: |
          DELAY=$(( RANDOM % 10800 ))  # 0 to 3 hours in seconds
          echo "Sleeping ${DELAY}s so the publish time varies run to run."
          sleep $DELAY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate this run's project
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate.js

      - name: Publish as a new public repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
        run: bash scripts/publish.sh

      - name: Update manifest and commit
        run: |
          git config user.name "craft-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repos.json
          if [ -d templates/queue ]; then
            git add templates/queue
          fi
          git diff --cached --quiet || git commit -m "Manifest: add $(cat .new-repo-name)"
          git push

      - name: Post project digest issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          FACTORY_REPO: ${{ github.repository }}
        run: node scripts/digest.js

  refine:
    needs: decide
    if: ${{ needs.decide.outputs.mode == 'refine' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post refinement pass issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          FACTORY_REPO: ${{ github.repository }}
        run: node scripts/refine.js
